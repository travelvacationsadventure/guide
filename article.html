<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article - WanderLanka</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">🏝️ Wander<span>Lanka</span></a>
      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="destinations.html" class="nav-link">Destinations</a></li>
        <li><a href="blog.html" class="nav-link active">Travel Guides</a></li>
        <li><a href="about.html" class="nav-link">About</a></li>
        <li><a href="contact.html" class="nav-link">Contact</a></li>
        <li><a href="admin.html" class="btn-primary">Admin Portal</a></li>
      </ul>
    </div>
  </header>

  <main class="container">
    <div class="article-container" id="article-wrapper">
      <p style="text-align: center; color: var(--text-muted);">Loading article...</p>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom">
      <p>&copy; 2026 WanderLanka Guide. All rights reserved.</p>
    </div>
  </footer>

  <script type="module">
    import { db, doc, getDoc } from './js/firebase-config.js';

    async function loadArticle() {
      const wrapper = document.getElementById('article-wrapper');
      const urlParams = new URLSearchParams(window.location.search);
      const articleId = urlParams.get('id');

      if (!articleId) {
        wrapper.innerHTML = `
          <h2>No Article Selected</h2>
          <p>Please browse our <a href="blog.html" style="color:var(--primary); text-decoration:underline;">travel guides list</a> to pick an article.</p>
        `;
        return;
      }

      try {
        const docRef = doc(db, "posts", articleId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const post = docSnap.data();
          document.title = `${post.title} - WanderLanka`;

          wrapper.innerHTML = `
            <img class="article-hero-img" src="${post.image || 'https://images.unsplash.com/photo-1546708973-b339540b5162?auto=format&fit=crop&w=1200&q=80'}" alt="${post.title}">
            <div class="article-header">
              <span class="badge">${post.category || 'Travel Guide'}</span>
              <h1>${post.title}</h1>
              <div style="display:flex; gap:1.5rem; color:var(--text-muted); font-size:0.875rem; margin-bottom:1.5rem;">
                <span>✍️ ${post.author || 'Editorial Team'}</span>
                <span>⏱️ ${post.readTime || '5 min read'}</span>
              </div>
            </div>
            <div class="article-content">
              ${post.content ? post.content.replace(/\n/g, '<br><br>') : '<p>No content provided.</p>'}
            </div>
            <div style="margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--gray-200);">
              <a href="blog.html" class="btn-outline">&larr; Back to all travel guides</a>
            </div>
          `;
        } else {
          wrapper.innerHTML = `<h2>Article not found</h2><p>This post might have been removed or unpublished.</p>`;
        }
      } catch (err) {
        console.error("Error reading article:", err);
        wrapper.innerHTML = `<p style="color:var(--danger);">Error loading article from cloud database.</p>`;
      }
    }

    loadArticle();
  </script>
</body>
</html>
