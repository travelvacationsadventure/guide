<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - WanderLanka</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">🏝️ Wander<span>Lanka</span></a>
      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="destinations.html" class="nav-link">Destinations</a></li>
        <li><a href="blog.html" class="nav-link">Travel Guides</a></li>
        <li><a href="about.html" class="nav-link">About</a></li>
        <li><a href="contact.html" class="nav-link active">Contact</a></li>
        <li><a href="admin.html" class="btn-primary">Admin Portal</a></li>
      </ul>
    </div>
  </header>

  <main class="container" style="max-width: 650px; padding: 4rem 1rem;">
    <div class="section-head">
      <h2>Have a Question or Story?</h2>
      <p>Send our editorial and planning team a direct message</p>
    </div>

    <div style="background:#fff; padding:2rem; border-radius:var(--radius-md); box-shadow:var(--shadow-sm);">
      <div id="contact-alert" style="display:none; padding:1rem; border-radius:var(--radius-sm); margin-bottom:1.5rem;"></div>

      <form id="contact-form">
        <div class="form-group">
          <label class="form-label" for="c-name">Your Full Name</label>
          <input type="text" id="c-name" class="form-control" required placeholder="e.g. John Doe">
        </div>
        <div class="form-group">
          <label class="form-label" for="c-email">Your Email Address</label>
          <input type="email" id="c-email" class="form-control" required placeholder="john@example.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="c-subject">Subject / Purpose</label>
          <input type="text" id="c-subject" class="form-control" required placeholder="Itinerary Advice / Partnership">
        </div>
        <div class="form-group">
          <label class="form-label" for="c-message">Your Message</label>
          <textarea id="c-message" rows="5" class="form-control" required placeholder="Write your message here..."></textarea>
        </div>
        <button type="submit" id="c-submit" class="btn-primary" style="width:100%; justify-content:center;">
          Send Message
        </button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom">
      <p>&copy; 2026 WanderLanka Guide. All rights reserved.</p>
    </div>
  </footer>

  <script type="module">
    import { db, collection, addDoc, serverTimestamp } from './js/firebase-config.js';

    const form = document.getElementById('contact-form');
    const alertBox = document.getElementById('contact-alert');
    const submitBtn = document.getElementById('c-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerText = "Transmitting...";

      try {
        await addDoc(collection(db, "inquiries"), {
          name: document.getElementById('c-name').value.trim(),
          email: document.getElementById('c-email').value.trim(),
          subject: document.getElementById('c-subject').value.trim(),
          message: document.getElementById('c-message').value.trim(),
          status: 'unread',
          createdAt: serverTimestamp()
        });

        alertBox.style.display = 'block';
        alertBox.style.background = 'var(--primary-light)';
        alertBox.style.color = 'var(--primary)';
        alertBox.innerText = "Thank you! Your inquiry has been delivered directly to our team.";
        form.reset();
      } catch (err) {
        console.error("Failed to post message:", err);
        alertBox.style.display = 'block';
        alertBox.style.background = '#fee2e2';
        alertBox.style.color = 'var(--danger)';
        alertBox.innerText = "Error sending message. Please try again later.";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Send Message";
      }
    });
  </script>
</body>
</html>
